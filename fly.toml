app = "179030-phoenix"
primary_region = "iad"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "10s"




[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
